# Hindi leak-verifier lexicon — Devanagari AND Hinglish (romanized) forms.
# The verifier normalizes (NFKC, lowercase) and transliterates Devanagari to
# Latin deterministically, so "क्लाउडनाइन", "cloudnine" and "klaudnain" all
# match the same alias set. Both scripts are first-class citizens here.
