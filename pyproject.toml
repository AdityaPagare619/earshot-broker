[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earshot"
version = "1.0.0"
description = "A private task broker for Alexa+: sealed-speech architecture over MCP (spec 2025-11-25)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aditya Pagare" }]
keywords = ["alexa", "mcp", "privacy", "voice-assistant", "sealed-speech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Security",
]
requires-python = ">=3.10"
dependencies = []  # stdlib only — this is a feature, keep it that way

[project.urls]
Homepage = "https://github.com/AdityaPagare619/earshot-broker"
Documentation = "https://github.com/AdityaPagare619/earshot-broker#readme"
"Source Code" = "https://github.com/AdityaPagare619/earshot-broker"

[project.scripts]
earshot-demo = "earshot.demo.five_beats:main"
earshot-server = "earshot.gateway.mcp.server:main"
earshot-sim = "earshot.simulator.host:main"
earshot = "earshot.cli:main"

[tool.setuptools]
# Interim package-dir mapping (see docs/seats/pro-packaging/DESIGN.md §2).
# Files stay where they are; B lane's src/ migration only deletes these lines —
# every internal import is already absolute `earshot.*`, so moves are import-neutral.
packages = [
    "earshot",
    "earshot.slowlane",
    "earshot.hotlane",
    "earshot.secrecy",
    "earshot.gateway",
    "earshot.gateway.mcp",
    "earshot.gateway.adapters",
    "earshot.gateway.config",
    "earshot.simulator",
    "earshot.packs",
    "earshot.integration",
    "earshot.integration.fixtures",
    "earshot.trace_harness",
    "earshot.trace_harness.slo",
    "earshot.demo",
]

[tool.setuptools.package-dir]
# The `earshot` root lives in src/; subpackages are mapped to their current
# locations (B lane's src/ migration deletes these lines — imports are already
# absolute `earshot.*`, so the move is import-neutral).
"earshot" = "src/earshot"
"earshot.slowlane" = "packages/slowlane"
"earshot.hotlane" = "packages/hotlane"
"earshot.secrecy" = "packages/secrecy"
"earshot.gateway" = "services/gateway"
"earshot.gateway.mcp" = "services/gateway/mcp"
"earshot.gateway.adapters" = "services/gateway/adapters"
"earshot.gateway.config" = "services/gateway/config"
"earshot.simulator" = "apps/simulator"
"earshot.packs" = "packs"
"earshot.integration" = "integration"
"earshot.trace_harness" = "packages/trace-harness/trace_harness"
"earshot.demo" = "demo"

[tool.setuptools.package-data]
"earshot.packs" = ["**/*.yaml"]

[tool.pytest.ini_options]
# One invocation from repo root: `python -m pytest` — no PYTHONPATH hacks.
# packages/kernel is FROZEN with its own unittest invocation; excluded here.
testpaths = [
    "packages/slowlane",
    "packages/hotlane",
    "packages/secrecy",
    "packages/trace-harness",
    "services",
    "apps/simulator",
    "integration",
    "packs",
    "tests",
    "demo",
]
